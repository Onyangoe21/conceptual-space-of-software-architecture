name: Build paper

# Compiles every paper under paper/ and the companion under supplement/ on every pull request
# and every push to main that touches them, and uploads the resulting PDFs as an artifact so a reviewer can read the effect of a change without
# installing LaTeX.
#
# The change detection lives in a job condition rather than in a `paths:` filter on the trigger.
# A workflow skipped by a path filter never reports a status at all, which leaves a required
# check pending forever on pull requests that do not touch the paper. A job skipped by an `if:`
# condition does report, and counts as passing. Most pull requests here will be evidence files
# rather than paper text, so this matters more than it usually would.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-paper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect paper changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether paper/ changed
        id: check
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual run, building unconditionally."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$BASE_SHA"
          if [ -z "$base" ]; then base="$BEFORE_SHA"; fi

          # A new branch, a force push, or a first commit leaves no usable base. Build rather
          # than guess.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable base commit, building unconditionally."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$base" "$HEAD_SHA" \
              | grep -Eq '^(paper/|supplement/|\.github/workflows/build-paper\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing under paper/ or supplement/ changed, skipping the build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Compile with pdflatex
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4

      # Two passes minimum, since cross references need a second one. Up to four, because this
      # document carries a table of contents and a longtable, and a longtable settles its column
      # widths over an additional pass. Stopping at two would fail on a document that is
      # perfectly well formed.
      # The companion document is generated from supplement/sources.json. Regenerate it first
      # so that a pull request which edits the JSON but forgets to rerun the script still builds
      # the document the JSON describes, and the diff check below catches the omission.
      - name: Regenerate the companion document from its JSON
        run: |
          set -eu
          python3 supplement/build_supplement.py supplement/sources.json supplement/how-the-sources-were-read.tex
          if ! git diff --quiet -- supplement/how-the-sources-were-read.tex; then
            echo "::error::supplement/how-the-sources-were-read.tex is out of date. Run supplement/build_supplement.py and commit the result."
            git --no-pager diff --stat -- supplement/how-the-sources-were-read.tex
            exit 1
          fi

      # Two passes minimum, since cross references need a second one. Up to four, because these
      # documents carry tables of contents and longtables, and a longtable settles its column
      # widths over an additional pass. Stopping at two would fail on a document that is
      # perfectly well formed.
      - name: Compile every document until the cross references settle
        run: |
          set -eu
          for doc in paper/conceptual-space-arxiv paper/what-computation-costs supplement/how-the-sources-were-read; do
            dir=$(dirname "$doc"); base=$(basename "$doc")
            pass=0
            while [ "$pass" -lt 4 ]; do
              pass=$((pass + 1))
              echo "::group::pdflatex ${base} pass ${pass}"
              (cd "$dir" && pdflatex -interaction=nonstopmode -halt-on-error -file-line-error "${base}.tex")
              echo "::endgroup::"
              if [ "$pass" -lt 2 ]; then continue; fi
              if grep -qE "Rerun to get|Label\(s\) may have changed" "${doc}.log"; then
                echo "Cross references still moving after pass ${pass}, running again."
              else
                echo "Cross references settled after pass ${pass}."
                break
              fi
            done
          done

      # pdflatex exits zero on undefined references and citations, since they are warnings
      # rather than errors. For a paper this is exactly the failure worth catching: a dangling
      # cross reference renders as a bare question mark in the PDF and nobody notices until it
      # is on arXiv.
      - name: Fail on undefined references or citations
        run: |
          set -u
          status=0
          for log in paper/conceptual-space-arxiv.log paper/what-computation-costs.log supplement/how-the-sources-were-read.log; do
            if grep -nE "LaTeX Warning: (Reference|Citation) .* undefined" "$log"; then
              echo "::error::Undefined reference or citation in ${log}. See the lines above."
              status=1
            fi
            if grep -nE "There were undefined references" "$log"; then
              echo "::error::${log}: LaTeX reported undefined references at the end of the run."
              status=1
            fi
            if grep -nE "Rerun to get|Label\(s\) may have changed" "$log"; then
              echo "::error::${log}: cross references had still not settled after four passes."
              status=1
            fi
          done
          if [ "$status" -eq 0 ]; then echo "No undefined references or citations."; fi
          exit "$status"

      - name: Report the page counts
        if: always()
        run: |
          for log in paper/conceptual-space-arxiv.log paper/what-computation-costs.log supplement/how-the-sources-were-read.log; do
            pages=$(grep -oE "Output written on .* \(([0-9]+) pages" "$log" | grep -oE "[0-9]+ pages" || true)
            echo "${log%.log}: ${pages:-unknown page count}"
          done

      - name: Upload the PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdfs
          path: |
            paper/conceptual-space-arxiv.pdf
            paper/what-computation-costs.pdf
            supplement/how-the-sources-were-read.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Upload the LaTeX log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs
          path: |
            paper/*.log
            supplement/*.log
          if-no-files-found: warn
          retention-days: 14
